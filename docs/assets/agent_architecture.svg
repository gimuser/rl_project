<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <rect x="40" y="40" width="1120" height="680" rx="20" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="80" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Architecture du système RL pour triage d’alertes SOAR</text>
  <rect x="90" y="140" width="180" height="80" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="122" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1d4ed8">1. Données</text>
  <text x="110" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">CSV / logs / alertes</text>

  <rect x="330" y="140" width="200" height="80" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#0f172a">2. Data Pipeline</text>
  <text x="348" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Loader • Cleaner • Encoder</text>

  <rect x="590" y="140" width="220" height="80" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="620" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#0f172a">3. Environnement</text>
  <text x="608" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">État • Actions • Observations</text>

  <rect x="860" y="140" width="220" height="80" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="900" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#0f172a">4. Simulation SOC</text>
  <text x="892" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Alertes • incidents • trafic</text>

  <path d="M270 180 L330 180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M530 180 L590 180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M810 180 L860 180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="250" y="300" width="240" height="100" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="292" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#0f766e">5. Agent RL</text>
  <text x="278" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">PPO • DQN • A2C • Policy</text>

  <rect x="530" y="300" width="240" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="582" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#92400e">6. Récompenses</text>
  <text x="555" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#92400e">Severity • Analyst • Latency</text>

  <rect x="810" y="300" width="260" height="100" rx="16" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
  <text x="860" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#4d7c0f">7. API / Monitoring</text>
  <text x="818" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4d7c0f">FastAPI • Logs • Metrics • Eval</text>

  <path d="M970 220 L970 300" stroke="#65a30d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M530 350 L490 350" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M770 350 L810 350" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="230" y="470" width="740" height="180" rx="18" fill="#f8fafc" stroke="#dbe4f0" stroke-width="2"/>
  <text x="260" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Flux de décision</text>
  <text x="260" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">L’agent observe l’état du SOC, choisit une action de triage, reçoit une récompense et met à jour son comportement.</text>
  <text x="260" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">En pratique : détecter → prioriser → contenir / investiguer / escalader / dismiss.</text>
  <text x="260" y="605" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Tous les résultats sont suivis dans les services de monitoring, les métriques et les rapports d’évaluation.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
